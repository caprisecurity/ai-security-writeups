<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bug Bounty : Capri</title>
<style>
:root{
  --bg:#060608; --panel:#0e0e13; --border:#271a24;
  --fg:#f1eef4; --fg-muted:#9a8fa3; --accent:#ff2e8a; --accent-soft:#2a0f1e;
  --font-sans: "Inter", -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", monospace;
}
*{box-sizing:border-box}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap');
body{
  margin:0; background:var(--bg); color:var(--fg); font-family:var(--font-sans); -webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(rgba(255,46,138,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,46,138,0.04) 1px, transparent 1px);
  background-size:36px 36px;
}
.wrap{max-width:720px;margin:0 auto;padding:40px 20px 60px}

.back{display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:13px; color:var(--fg-muted); text-decoration:none; margin-bottom:32px; transition:color .15s ease}
.back:hover{color:var(--accent)}

h1{font-size:24px; font-weight:800; margin:0 0 8px; letter-spacing:-0.01em}
.sub{font-size:13.5px; color:var(--fg-muted); margin:0 0 32px; line-height:1.5}

.chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:32px}
.chip{font-family:var(--font-mono); font-size:11.5px; font-weight:600; background:var(--accent-soft); border:1px solid color-mix(in srgb, var(--accent) 40%, var(--border)); color:var(--accent); padding:5px 11px; border-radius:999px}

.liens{display:flex; flex-direction:column}
.lien-card{display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border); padding:16px 4px; text-decoration:none; color:var(--fg); transition:color .15s ease}
.liens .lien-card:last-child{border-bottom:1px solid var(--border)}
.lien-card:hover{color:var(--accent)}
.lien-card .num{font-family:var(--font-mono); font-size:12px; color:var(--fg-muted); margin-right:14px}
.lien-card .logo{width:22px; height:22px; border-radius:5px; margin-right:12px; flex:none; object-fit:contain; background:#fff; padding:2px}
.lien-card .titre{font-size:14.5px; font-weight:700}
.lien-card .desc{font-size:12.5px; color:var(--fg-muted); margin-top:3px}
.lien-card .arrow{color:var(--accent); font-family:var(--font-mono); font-size:16px; flex:none}
</style>
</head>
<body>
<div class="wrap">

  <a class="back" href="index.html">← accueil</a>

  <h1>Bug Bounty</h1>
  <p class="sub">Actif en bug bounty sécurité IA, tests sur des challenges reconnus par la communauté.</p>

  <div class="chips">
    <span class="chip">Prompt Injection</span>
    <span class="chip">RAG Leakage</span>
    <span class="chip">LLM Guard</span>
    <span class="chip">OWASP LLM Top 10</span>
  </div>

  <div class="liens">
    <a class="lien-card" href="https://huntr.com/users/capri207" target="_blank" rel="noopener">
      <div style="display:flex; align-items:center">
        <img class="logo" src="https://www.google.com/s2/favicons?domain=huntr.com&sz=64" alt="" loading="lazy">
        <div>
          <div class="titre">Profil Huntr</div>
          <div class="desc">Challenges sécurité IA, sponsorisés par Palo Alto Networks</div>
        </div>
      </div>
    </a>
  </div>

</div>


</body>
</html>
