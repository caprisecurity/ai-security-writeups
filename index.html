<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capri — Sécurité IA & Red-teaming</title>
<meta name="description" content="Audits de robustesse offensifs pour toute forme d'IA ou de LLM.">
<style>
:root{
  --bg:#060608; --panel:#0e0e13; --border:#271a24;
  --fg:#f1eef4; --fg-muted:#9a8fa3; --accent:#ff2e8a; --accent-soft:#2a0f1e;
  --font-sans: "Inter", -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", monospace;
}
*{box-sizing:border-box}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap');
body{
  margin:0; background:var(--bg); color:var(--fg); font-family:var(--font-sans); -webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(rgba(255,46,138,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,46,138,0.04) 1px, transparent 1px);
  background-size:36px 36px;
  min-height:100vh;
}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}

.hero{min-height:100vh; padding:40px 0; text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center}
.avatar{width:88px; height:88px; border-radius:50%; object-fit:cover; border:2px solid var(--accent); box-shadow:0 0 28px -4px color-mix(in srgb, var(--accent) 70%, transparent); margin-bottom:22px}
.hero h1{font-size:36px; font-weight:800; letter-spacing:-0.02em; margin:0 0 10px; font-family:var(--font-mono); text-transform:lowercase; color:var(--fg); text-shadow:0 0 24px color-mix(in srgb, var(--accent) 45%, transparent)}
.hero .tagline{font-size:15px; color:var(--fg-muted); max-width:420px; line-height:1.5; margin:0 0 36px}

.boutons{display:flex; flex-direction:column; gap:14px; width:100%; max-width:320px}
.bouton{display:block; font-family:var(--font-mono); font-size:14px; font-weight:700; text-decoration:none; padding:16px 20px; border-radius:10px; text-align:center}
.bouton.principal{background:var(--accent); color:#060608; box-shadow:0 0 20px -4px color-mix(in srgb, var(--accent) 70%, transparent)}
.bouton.secondaire{background:var(--panel); color:var(--fg); border:1px solid var(--border)}
.bouton .sub{display:block; font-family:var(--font-sans); font-size:11.5px; font-weight:400; color:currentColor; opacity:.75; margin-top:3px}
</style>
</head>
<body>

<div class="wrap">
  <section class="hero">
    <img class="avatar" src="assets/avatar.jpg" alt="Capri">
    <h1>capri</h1>
    <p class="tagline">Chercheur en sécurité IA — audits offensifs pour toute forme d'IA ou de LLM.</p>

    <div class="boutons">
      <a class="bouton principal" href="audit.html">
        Discuter d'un audit →
        <span class="sub">Méthodologie, exemples, contact</span>
      </a>
      <a class="bouton secondaire" href="bugbounty.html">
        Bug Bounty
        <span class="sub">Profil Huntr, Discord, communauté</span>
      </a>
    </div>
  </section>
</div>
</body>
</html>
